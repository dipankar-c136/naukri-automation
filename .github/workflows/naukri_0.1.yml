name: Naukri Automation Tests

on:
  push:
    branches: [ "main", "master", "dipankar_infy_0.1" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Create directories
        run: |
          mkdir -p target/cucumber-reports
          mkdir -p target/surefire-reports
          mkdir -p target/screenshots
          mkdir -p test-output

      - name: Setup Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run Tests
        env:
          DISPLAY: :99
          CHROME_OPTIONS: "--headless=new --no-sandbox --disable-dev-shm-usage --window-size=1920,1080"
        run: |
          mvn clean test \
            -Dwebdriver.chrome.whitelistedIps="" \
            -Dwebdriver.http.factory=jdk-http-client \
            -Dselenium.browser.timeout=60000

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/cucumber-reports/
            test-output/
            target/screenshots/
          retention-days: 7